name: Submarine Cable Monitor

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/**"
      - "src/**"
      - "tests/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional sources: google_news subtelforum submarinenetworks"
        required: false
        default: ""
      since:
        description: "Only collect articles on/after YYYY-MM-DD (blank uses configured lookback)"
        required: false
        default: ""
      dry_run:
        description: "Run a small sample without committing data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: submarine-cable-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Collect, Export, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression checks
        run: |
          python -m unittest discover -s tests

      - name: Initialize event store
        if: ${{ github.event_name != 'push' }}
        run: |
          mkdir -p data docs/data logs
          python -m src.main --init-db

      - name: Run monitor
        if: ${{ github.event_name != 'push' }}
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: ${{ secrets.SILICONFLOW_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-ai/DeepSeek-V3' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
          MONITOR_SOURCES: ${{ github.event.inputs.sources }}
          MONITOR_SINCE: ${{ github.event.inputs.since }}
          MONITOR_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--run)
          if [ -n "$MONITOR_SOURCES" ]; then
            read -r -a SOURCES <<< "$MONITOR_SOURCES"
            ARGS+=(--sources "${SOURCES[@]}")
          fi
          if [ -n "$MONITOR_SINCE" ]; then ARGS+=(--since "$MONITOR_SINCE"); fi
          if [ "$MONITOR_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m src.main "${ARGS[@]}"

      - name: Publish diagnostic summary
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          if [ -f logs/runs/latest-summary.md ]; then
            cat logs/runs/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; s=json.load(open("logs/runs/latest-summary.json")); print("::warning::Collection was degraded; inspect the diagnostic summary and audit artifact.") if s.get("status") == "degraded" else None'
          else
            echo "No diagnostic summary produced; inspect the failed step and monitor artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export data for GitHub Pages
        if: ${{ github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        run: |
          python -m src.main --clean-store --translate-missing --export-json docs/data/events.json --export-csv docs/data/events.csv

      - name: Upload monitor artifacts
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/events.jsonl
            data/article-state.json
            docs/data/events.json
            docs/data/events.csv
            logs/runs/
            logs/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Commit and push data updates
        if: ${{ github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/events.jsonl docs/data/events.json docs/data/events.csv
          if [ -f data/article-state.json ]; then git add data/article-state.json; fi
          if git diff --quiet && git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update submarine cable events"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Setup Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: monitor
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    needs: [monitor, deploy-pages]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoring-failure'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Submarine Cable Monitor Failed',
                body: 'The scheduled submarine cable monitoring workflow failed. Check the workflow logs for details.',
                labels: ['monitoring-failure']
              });
            }
