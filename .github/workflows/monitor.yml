name: Submarine Cable Monitor

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/**"
      - "src/**"
      - "scripts/notify_monitor.py"
      - "tests/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional sources: google_news subtelforum submarinenetworks"
        required: false
        default: ""
      since:
        description: "Only collect articles on/after YYYY-MM-DD (blank uses configured lookback)"
        required: false
        default: ""
      dry_run:
        description: "Run a small sample without committing data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: submarine-cable-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    name: Collect, Export, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages-ready: ${{ steps.pages_artifact.outcome }}
      notification-outcome: ${{ steps.notify.outcome }}
      infrastructure-failed: ${{ steps.persist_alert.outcome == 'failure' || steps.monitor_artifacts.outcome == 'failure' || steps.pages_setup.outcome == 'failure' || steps.pages_artifact.outcome == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Resolve the branch after waiting for the prior collection/deploy run.
          # The triggering SHA can predate data committed while this run queued.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser for public article rendering
        if: ${{ github.event_name != 'push' }}
        run: python -m playwright install --with-deps chromium

      - name: Run regression checks
        run: |
          python -m unittest discover -s tests

      - name: Initialize event store
        if: ${{ github.event_name != 'push' }}
        run: |
          mkdir -p data docs/data logs
          python -m src.main --init-db

      - name: Run monitor
        id: collection
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          MONITOR_BROWSER_FALLBACK: '1'
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          SILICONFLOW_BASE_URL: ${{ secrets.SILICONFLOW_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-ai/DeepSeek-V3' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-m3' }}
          MONITOR_SOURCES: ${{ github.event.inputs.sources }}
          MONITOR_SINCE: ${{ github.event.inputs.since }}
          MONITOR_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--run)
          if [ -n "$MONITOR_SOURCES" ]; then
            read -r -a SOURCES <<< "$MONITOR_SOURCES"
            ARGS+=(--sources "${SOURCES[@]}")
          fi
          if [ -n "$MONITOR_SINCE" ]; then ARGS+=(--since "$MONITOR_SINCE"); fi
          if [ "$MONITOR_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python -m src.main "${ARGS[@]}"

      - name: Publish diagnostic summary
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          if [ -f logs/runs/latest-summary.md ]; then
            cat logs/runs/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; s=json.load(open("logs/runs/latest-summary.json")); print("::warning::Collection was degraded; inspect the diagnostic summary and audit artifact.") if s.get("status") == "degraded" else None'
          else
            echo "No diagnostic summary produced; inspect the failed step and monitor artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export data for GitHub Pages
        id: export
        if: ${{ always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          python -m src.main --export-json docs/data/events.json --export-csv docs/data/events.csv

      - name: Persist completed events and unfinished queue
        id: persist_collection
        if: ${{ always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          for file in data/events.jsonl data/article-state.json data/article-queue.json data/alert-state.json docs/data/events.json docs/data/events.csv; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --staged --quiet; then
            echo "No collection state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist cable events and collection queue"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Notify collection health
        id: notify
        if: ${{ always() && github.event_name != 'push' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_GITHUB_USER: li-yang23
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          MONITOR_DRY_RUN: ${{ github.event.inputs.dry_run }}
          WORKFLOW_HEALTH: ${{ job.status != 'success' && 'failure' || steps.collection.outcome != 'success' && 'failure' || steps.export.outcome == 'failure' && 'failure' || steps.persist_collection.outcome == 'failure' && 'failure' || 'success' }}
        run: |
          ARGS=(--summary logs/runs/latest-summary.json --state data/alert-state.json --workflow-status "$WORKFLOW_HEALTH")
          if [ "$MONITOR_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/notify_monitor.py "${ARGS[@]}"

      - name: Persist delivered notification state
        id: persist_alert
        if: ${{ always() && github.event_name != 'push' && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ ! -f data/alert-state.json ]; then exit 0; fi
          git add -- data/alert-state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: persist monitor notification state"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload monitor artifacts
        id: monitor_artifacts
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/events.jsonl
            data/article-state.json
            data/article-queue.json
            data/alert-state.json
            docs/data/events.json
            docs/data/events.csv
            logs/runs/
            logs/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Setup Pages
        id: pages_setup
        if: ${{ always() && github.event.inputs.dry_run != 'true' && (github.event_name == 'push' && success() || steps.export.outcome == 'success' && steps.persist_collection.outcome == 'success') }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: pages_artifact
        if: ${{ always() && steps.pages_setup.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/"

      - name: Require healthy collection and durable state
        if: ${{ always() && github.event_name != 'push' }}
        env:
          COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          PERSIST_COLLECTION_OUTCOME: ${{ steps.persist_collection.outcome }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
          PERSIST_ALERT_OUTCOME: ${{ steps.persist_alert.outcome }}
          MONITOR_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ["COLLECTION_OUTCOME", "NOTIFY_OUTCOME"]
          if os.environ["MONITOR_DRY_RUN"] != "true":
              required += ["EXPORT_OUTCOME", "PERSIST_COLLECTION_OUTCOME", "PERSIST_ALERT_OUTCOME"]
          failures = [name for name in required if os.environ[name] != "success"]
          try:
              summary = json.loads(Path("logs/runs/latest-summary.json").read_text())
              if summary.get("status") != "success":
                  failures.append("collection_health")
          except (OSError, ValueError, AttributeError):
              failures.append("missing_or_invalid_summary")
          if failures:
              print("::error::Collection requires attention: " + ", ".join(failures) + ". Inspect the saved queue, health notification and audit artifact.")
              raise SystemExit(1)
          PY

  deploy-pages:
    name: Deploy GitHub Pages
    needs: monitor
    if: ${{ always() && github.event.inputs.dry_run != 'true' && needs.monitor.outputs.pages-ready == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-on-failure:
    needs: [monitor, deploy-pages]
    if: ${{ always() && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify infrastructure or notification failure
        uses: actions/github-script@v7
        env:
          INFRA_FAILED: ${{ needs.deploy-pages.result == 'failure' || needs.monitor.outputs.infrastructure-failed == 'true' || (needs.monitor.result == 'failure' || needs.monitor.result == 'cancelled') && needs.monitor.outputs.notification-outcome != 'success' }}
        with:
          script: |
            const title = '[monitor] Workflow infrastructure requires attention';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `@li-yang23\n\n采集工作流或告警投递未成功完成，请检查运行记录：${runUrl}。未假定本次新闻已处理或邮件已发送。`;
            // Retry only this read. Retrying a comment/create after an unknown
            // server response could send duplicate notifications.
            let issues;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                issues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100
                });
                break;
              } catch (error) {
                if (attempt === 2 || error.status < 500 || error.status >= 600) throw error;
                await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
              }
            }
            const existing = issues.data.find(issue => issue.title === title && !issue.pull_request);
            if (process.env.INFRA_FAILED !== 'true') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `工作流保存、通知及部署步骤已恢复。采集内容是否仍待处理请查看独立的采集健康告警。运行：${runUrl}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed'
                });
              }
              return;
            }
            // An unresolved infrastructure incident already notified the user.
            // Keep details in the run log instead of posting periodic reminders.
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body
              });
            }
