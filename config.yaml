# Submarine Cable Monitor Configuration

# Request settings
request:
  delay_min: 1.0
  delay_max: 3.0
  timeout: 30
  max_retries: 3

# Database settings
database:
  path: data/events.db
  event_store_path: data/events.jsonl
  retention_days: 730  # 2 years

# LLM settings. API keys must come from environment variables/GitHub Secrets.
llm:
  model: deepseek-ai/DeepSeek-V3
  base_url: https://api.siliconflow.cn/v1/
  embedding_model: BAAI/bge-m3
  # Reserved for a future verified balance API; SiliconFlow retired /user/info
  # on 2026-08-14, so this threshold does not currently provide early warnings.
  low_balance_threshold: 5.0

# Zero limits mean unlimited. Runtime limits defer durable work to the next run.
article_sources:
  time_budget_seconds: 1200
  subtelforum_max_pages: 0
  subtelforum_max_articles: 0
  google_news_max_articles: 0
  google_news_max_attempts: 0
  google_news_lookback_days: 14
  # All queries are discovered first, then recent articles are fetched round-robin.
  google_news_keywords:
    - submarine cable fault
    - submarine cable outage
    - submarine cable break
    - undersea cable damage
    - subsea cable disruption
    - undersea cable outage
    - 海缆故障
    - 海底电缆故障
  submarine_networks_links_path: data/cable-links.json
  submarine_networks_max_cables: 0
  submarine_networks_articles_per_cable: 0

# One JSONL trace + JSON/Markdown summaries per run; no article bodies or LLM responses.
logging:
  audit_dir: logs/runs

# Discovered metadata never expires; pending work survives RSS windows.
article_queue:
  path: data/article-queue.json

# Legacy success cache; durable done entries prevent repeated extraction.
article_state:
  path: data/article-state.json
  refresh_days: 7
  retention_days: 30
  max_urls: 2000

# Scraper configurations
scrapers:
  telegeography:
    url: https://api.telegeography.com
    enabled: false
    update_interval_hours: 24
    api_key: ""  # Get from: https://www.telegeography.com/contact/

  infrapedia:
    url: https://api.infrapedia.com
    enabled: false
    update_interval_hours: 24
    api_key: ""  # Get from: https://www.infrapedia.com/api-access

  cablefaults:
    url: https://www.cablefaults.com
    enabled: true
    update_interval_hours: 6
    api_key: ""  # Not needed - web scraping

  google_news:
    url: https://news.google.com
    enabled: true
    update_interval_hours: 4
    api_key: ""  # Not needed - public RSS

  subtelforum:
    url: https://subtelforum.com/category/cable-faults-maintenance/
    enabled: true
    update_interval_hours: 24
    api_key: ""

  submarinenetworks:
    url: https://www.submarinenetworks.com
    enabled: true
    update_interval_hours: 24
    api_key: ""

  github:
    url: https://api.github.com
    enabled: true
    update_interval_hours: 24
    api_key: ""  # Get from: https://github.com/settings/tokens (repo scope)

# User agent
user_agent: "Mozilla/5.0 (compatible; SubmarineCableMonitor/1.0; +https://github.com/li-yang23/submarine-cable-monitor)"
